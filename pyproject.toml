
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskformer3d"
version = "0.1.0"
description = "Risk-aware Transformer for 3D UAV navigation"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "matplotlib",
    "plotly",
    "pyyaml",
    "tqdm"
]

[tool.setuptools.packages.find]
where = ["src"]
